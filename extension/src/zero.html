<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Zero</title>
    <style>
      :root {
        --bg: #f2f1ec;
        --ink: #21231d;
        --muted: #5c5a50;
        --faint: #7e7c6c;
        --accent: #3e5540;
        --rule: #dad6cb;
        --serif: ui-serif, 'New York', Georgia, 'Times New Roman', serif;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        text-align: center;
        padding: 40px;
        max-width: 560px;
      }
      .mark {
        display: inline-flex;
      }
      .mark svg {
        width: 52px;
        height: 52px;
        display: block;
        border-radius: 13px;
        box-shadow: 0 2px 10px rgba(30, 30, 20, 0.13);
      }
      h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 52px;
        letter-spacing: -0.5px;
        margin-top: 12px;
      }
      .sub {
        margin-top: 16px;
        color: var(--muted);
        font-size: 15.5px;
        line-height: 1.6;
      }
      .sub b {
        color: var(--ink);
        font-weight: 600;
      }
      .rule {
        width: 40px;
        height: 1px;
        background: var(--rule);
        margin: 26px auto 0;
      }
      .hint {
        margin-top: 16px;
        color: var(--faint);
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" id="mark"></div>
      <h1>Tab Zero.</h1>
      <div class="sub" id="sub">Nothing lost.</div>
      <div class="rule"></div>
      <div class="hint">Click the Tab Zero icon anytime to resurrect a trail.</div>
    </div>
    <script type="module" src="zero.js"></script>
  </body>
</html>
